name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: linux-x86_64
            ext: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: linux-arm64
            ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: darwin-arm64
            ext: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: darwin-x86_64
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
            ext: zip
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: windows-arm64
            ext: zip
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # aarch64 Linux 交叉编译需要 zig（musl 静态链接）
      - uses: taiki-e/install-action@v2
        if: matrix.target == 'aarch64-unknown-linux-musl'
        with:
          tool: cargo-zigbuild

      - name: Install zig
        if: matrix.target == 'aarch64-unknown-linux-musl'
        shell: bash
        run: |
          curl -fL https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz -o zig.tar.xz
          tar -xf zig.tar.xz
          sudo mv zig-x86_64-linux-0.17.0 /opt/zig
          sudo ln -s /opt/zig/zig /usr/local/bin/zig
          zig version

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            cargo zigbuild --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package (unix)
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/contextgate"
          mkdir -p "dist/contextgate-${{ matrix.artifact }}"
          cp "$BIN" "dist/contextgate-${{ matrix.artifact }}/contextgate"
          tar -czf "dist/contextgate-${{ matrix.artifact }}.${{ matrix.ext }}" \
            -C "dist/contextgate-${{ matrix.artifact }}" contextgate

      - name: Package (windows)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          $dir = "dist/contextgate-${{ matrix.artifact }}"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/contextgate.exe" $dir
          Compress-Archive -Path "$dir/contextgate.exe" -DestinationPath "dist/contextgate-${{ matrix.artifact }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: contextgate-${{ matrix.artifact }}
          path: |
            dist/contextgate-${{ matrix.artifact }}.tar.gz
            dist/contextgate-${{ matrix.artifact }}.zip

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec mv {} dist/ \;
          ls -l dist/

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          gh release create "$VERSION" \
            --title "contextgate $VERSION" \
            --notes "## 安装\n\`\`\`bash\ncurl -LO https://github.com/wsh66660/contextgate-rs/releases/download/$VERSION/contextgate-<平台>.tar.gz\ntar -xzf contextgate-<平台>.tar.gz\n# 把 contextgate 放进 PATH 即可\n\`\`\`" \
            --verify-tag \
            dist/*
